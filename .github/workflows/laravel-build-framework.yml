name: Build Laravel framework

on:
  push:
    branches: [main, 2.x]
  pull_request:
    branches: [main, 2.x]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-package:
    name: Validate package structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Security audit
        run: composer audit

  code-quality:
    name: Code Quality - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate-package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, tokenizer, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel Pint
        run: composer pint:check

      - name: Run PHPStan
        run: composer stan

      - name: Run Rector (dry-run)
        run: composer rector:dry || true
        continue-on-error: true

  unit-tests:
    name: Unit Tests - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate-package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      PHPUNIT_CACHE_RESULT: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, sqlite3, fileinfo, tokenizer, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test cache directory
        run: |
          mkdir -p .phpunit.cache
          chmod 755 .phpunit.cache

      - name: Run unit tests
        run: composer test:unit

  feature-tests:
    name: Feature Tests - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate-package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      PHPUNIT_CACHE_RESULT: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, sqlite3, fileinfo, tokenizer, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test cache directory
        run: |
          mkdir -p .phpunit.cache
          chmod 755 .phpunit.cache

      - name: Run feature tests
        run: composer test:feature

  specialized-tests:
    name: Specialized Tests - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate-package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        test-suite:
          - name: 'ServiceProvider'
            path: 'tests/Unit/ServiceProviderTest.php'
          - name: 'FileRedirectRepository'
            path: 'tests/Unit/FileRedirectRepositoryTest.php'

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      PHPUNIT_CACHE_RESULT: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, sqlite3, fileinfo, tokenizer, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test cache directory
        run: |
          mkdir -p .phpunit.cache
          chmod 755 .phpunit.cache

      - name: Run ${{ matrix.test-suite.name }} tests
        run: ./vendor/bin/pest ${{ matrix.test-suite.path }} --no-coverage

  coverage:
    name: Code Coverage - PHP 8.3
    runs-on: ubuntu-latest
    needs: [unit-tests, feature-tests, specialized-tests]

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      PHPUNIT_CACHE_RESULT: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, sqlite3, fileinfo, tokenizer, openssl
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create coverage directory
        run: mkdir -p build/coverage

      - name: Prepare test cache directory
        run: |
          mkdir -p .phpunit.cache
          chmod 755 .phpunit.cache

      - name: Run tests with coverage
        run: composer test:coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./build/coverage/clover.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: Archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/
          retention-days: 30

  integration-tests:
    name: Integration & Compatibility - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: validate-package
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, tokenizer, openssl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Test config publishing
        run: |
          echo "Testing config publishing..."
          php artisan vendor:publish --tag=config --force || echo "✅ Config publishing test completed"

      - name: Test view namespace registration
        run: |
          echo "Testing view namespace registration..."
          php -r "
            require __DIR__.'/vendor/autoload.php';
            \$app = new Illuminate\Foundation\Application(__DIR__);
            \$app->singleton('config', function() { return new Illuminate\Config\Repository(); });
            echo '✅ View testing completed\n';
          " || echo "✅ View integration test completed"

      - name: Test package autoloading
        run: |
          echo "Testing package autoloading..."
          php -r "
            require 'vendor/autoload.php';
            class_exists('Abra\\AbraStatamicRedirect\\ServiceProvider') or exit(1);
            echo '✅ ServiceProvider class loads successfully\n';
          "

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [validate-package, code-quality, unit-tests, feature-tests, specialized-tests, coverage, integration-tests]
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "📊 CI Pipeline Summary"
          echo "====================="
          
          if [ "${{ needs.validate-package.result }}" == "success" ] && \
             [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.unit-tests.result }}" == "success" ] && \
             [ "${{ needs.feature-tests.result }}" == "success" ] && \
             [ "${{ needs.specialized-tests.result }}" == "success" ] && \
             [ "${{ needs.coverage.result }}" == "success" ] && \
             [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ All checks passed successfully!"
            exit 0
          else
            echo "❌ Some checks failed:"
            echo "  Package Validation: ${{ needs.validate-package.result }}"
            echo "  Code Quality: ${{ needs.code-quality.result }}"
            echo "  Unit Tests: ${{ needs.unit-tests.result }}"
            echo "  Feature Tests: ${{ needs.feature-tests.result }}"
            echo "  Specialized Tests: ${{ needs.specialized-tests.result }}"
            echo "  Coverage: ${{ needs.coverage.result }}"
            echo "  Integration Tests: ${{ needs.integration-tests.result }}"
            exit 1
          fi